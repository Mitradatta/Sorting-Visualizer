function mergesort()

}

function merges(l,r,heights)
{
  if(l<r)
  {
       let m = Math.floor((l+r)/ 2);
       merges(l,m,heights);
       merges(m+1,r,heights);
       merging(l,m,r,heights);
  }
}


function merging(l,m,r,heights)
{
    let i = l;
    let j = m+1;
    let z = r;
    let  s = []
    while( i<=m && j<=r)
    {
         if(heights[i]<heights[j])
         {
              s.push(heights[i]);
              i++;
         }
         else {
             s.push(heights[j]);
             j++;
         }
    }

    while(i<=m)
    {
         s.push(heights[i])
         i++;
    }

    while(j<=r)
    {
        s.push(heights[j])
        j++;
    }

    var x=0;
    for(var k=l; k<=r; k++)
    {
          heights[k] = s[x];
          x++;
    }
    changecolor(l,r,"red");
    detailedupdate(s,l,r);
    changecolor(l,r,"pink");
}
